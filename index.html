<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tirum's Bio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box; margin: 0; padding: 0;
            -webkit-user-select: none; -moz-user-select: none;
            -ms-user-select: none; user-select: none;
        }
        body {
            background: url('bg.gif') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Inter', sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px; cursor: none;
            position: relative;
        }
        #tint-overlay {
            position: fixed; inset: 0;
            pointer-events: none; z-index: 0;
            background: rgba(255,140,0,0);
            transition: background-color 1.4s ease;
            mix-blend-mode: multiply;
        }
        #cursor-dot {
            position: fixed; width: 8px; height: 8px; background: #fff;
            border-radius: 50%; pointer-events: none; z-index: 99999;
            transform: translate(-50%,-50%);
            box-shadow: 0 0 6px rgba(255,255,255,0.8);
        }
        #cursor-ring {
            position: fixed; width: 28px; height: 28px;
            border: 1.5px solid rgba(255,255,255,0.65); border-radius: 50%;
            pointer-events: none; z-index: 99998; transform: translate(-50%,-50%);
            transition: width 0.2s, height 0.2s, border-color 0.2s;
        }
        body.hovering #cursor-ring { width: 44px; height: 44px; border-color: rgba(255,180,50,0.9); }
        body.hovering #cursor-dot { background: #ffb830; box-shadow: 0 0 10px rgba(255,180,30,0.9); }
        a, button, .play-btn, .ctrl-btn, .progress-track, .social-btn, .lyric-toggle { cursor: none !important; }

        .card {
            width: 100%;
            background: rgba(25,14,3,0.82);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(255,160,30,0.3);
            border-radius: 22px; overflow: hidden;
            color: #fff; box-shadow: 0 12px 40px rgba(180,80,0,0.25);
        }
        .banner { width: 100%; height: 120px; object-fit: cover; display: block; }
        .profile-area { padding: 0 22px 8px; position: relative; }
        .avatar-wrap {
            position: relative; display: inline-block;
            margin-top: -44px; margin-bottom: 8px;
        }
        .avatar {
            width: 86px; height: 86px; border-radius: 50%;
            border: 3px solid rgba(255,160,30,0.7);
            object-fit: cover; display: block; background: #1a0a00;
            box-shadow: 0 0 14px rgba(255,150,20,0.4);
        }
        .online-dot {
            position: absolute; bottom: 5px; right: 5px;
            width: 14px; height: 14px; background: #43b581;
            border-radius: 50%; border: 2.5px solid rgba(25,14,3,1);
        }
        .name-row { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
        .name { font-family: 'VT323', monospace; font-size: 34px; letter-spacing: 1px; }
        .bio-text { font-size: 13px; opacity: 0.75; margin-bottom: 16px; }

        .social-row {
            display: flex; justify-content: center; gap: 14px;
            padding: 10px 22px 14px;
            border-bottom: 1px solid rgba(255,150,20,0.15);
        }
        .social-btn {
            width: 42px; height: 42px; border-radius: 50%;
            border: 1.5px solid rgba(255,150,20,0.45);
            display: flex; align-items: center; justify-content: center;
            color: #fff; text-decoration: none; font-size: 17px;
            transition: all 0.2s; background: rgba(200,100,0,0.1);
        }
        .social-btn:hover { background: rgba(255,150,20,0.25); transform: scale(1.1); box-shadow: 0 0 12px rgba(255,150,20,0.35); }

        .section {
            margin: 12px 14px; border: 1px solid rgba(255,150,20,0.2);
            border-radius: 14px; padding: 13px; background: rgba(20,8,0,0.35);
        }
        .discord-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .discord-avatar {
            width: 44px; height: 44px; border-radius: 50%;
            background: linear-gradient(135deg,#c87800,#8b4500);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; position: relative; flex-shrink: 0;
            box-shadow: 0 0 10px rgba(200,120,0,0.3);
        }
        .discord-status-dot {
            position: absolute; bottom: 1px; right: 1px;
            width: 11px; height: 11px; background: #43b581;
            border-radius: 50%; border: 2px solid rgba(25,14,3,1);
        }
        .discord-info { flex: 1; min-width: 0; }
        .discord-name { font-family: 'VT323',monospace; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .discord-activity { font-family: 'VT323',monospace; font-size: 13px; opacity: 0.6; }
        .discord-add-btn {
            border: 1.5px solid rgba(255,160,30,0.55); border-radius: 20px;
            padding: 5px 13px; font-size: 12px; color: #ffb830; cursor: pointer;
            background: transparent; font-family: 'Inter',sans-serif;
            white-space: nowrap; transition: background 0.2s;
        }
        .discord-add-btn:hover { background: rgba(255,150,20,0.15); }
        .copy-notif { display: none; font-size: 12px; color: #43b581; text-align: center; margin-top: 5px; }
        .discord-divider { border: none; border-top: 1px solid rgba(255,255,255,0.12); margin: 10px 0; }
        .status-box-inner { display: flex; align-items: flex-start; gap: 10px; }
        .status-thumb {
            width: 50px; height: 50px; border-radius: 8px;
            background: rgba(0,0,0,0.3); display: flex;
            align-items: center; justify-content: center;
            font-size: 24px; flex-shrink: 0;
        }
        .status-details { flex: 1; }
        .status-title { font-family: 'VT323',monospace; font-size: 16px; margin-bottom: 3px; }
        .status-sub { font-family: 'VT323',monospace; font-size: 13px; opacity: 0.6; line-height: 1.5; }

        /* MUSIC PLAYER */
        .music-section {
            margin: 0 14px 14px;
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 14px; padding: 13px;
            background: rgba(0,0,0,0.18);
        }
        .music-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        .music-vol-icon { font-size: 14px; opacity: 0.7; }
        .song-name {
            flex: 1; font-family: 'VT323',monospace; font-size: 20px;
            text-align: center; letter-spacing: 0.4px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .lyric-toggle {
            font-size: 12px; opacity: 0.65; background: none; border: none;
            color: #fff; padding: 2px 6px; border-radius: 8px;
            transition: opacity 0.2s; white-space: nowrap;
        }
        .lyric-toggle:hover { opacity: 1; background: rgba(255,255,255,0.1); }

        .progress-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        .time-label { font-family: 'VT323',monospace; font-size: 15px; opacity: 0.7; min-width: 36px; }
        .time-label.right { text-align: right; }
        .progress-track {
            flex: 1; height: 28px; background: transparent;
            cursor: pointer; position: relative;
            display: flex; align-items: center; gap: 2px;
            overflow: hidden;
        }
        .wave-bar {
            flex: 1; min-width: 2px;
            background: rgba(255,150,20,0.22);
            border-radius: 2px;
            transition: background 0.25s ease, box-shadow 0.25s ease;
            pointer-events: none;
        }
        .wave-bar.played {
            background: linear-gradient(180deg,#ffcc55,#ff8c00);
            box-shadow: 0 0 5px rgba(255,160,30,0.6);
        }
        .progress-thumb {
            position: absolute; top: 50%;
            transform: translate(-50%,-50%);
            width: 12px; height: 12px; background: #ffcc40;
            border-radius: 50%; pointer-events: none;
            box-shadow: 0 0 10px rgba(255,170,30,0.85);
            transition: left 0.15s linear, transform 0.12s;
            z-index: 2;
        }
        .progress-track:hover .progress-thumb {
            transform: translate(-50%,-50%) scale(1.3);
        }
        .progress-track.dragging .progress-thumb {
            transform: translate(-50%,-50%) scale(1.55);
            background: #ffe08a;
        }
        .controls-row { display: flex; justify-content: center; align-items: center; gap: 24px; }
        .ctrl-btn {
            background: none; border: none; color: #fff; cursor: pointer;
            font-size: 17px; opacity: 0.75; transition: all 0.15s; padding: 4px;
        }
        .ctrl-btn:hover { opacity: 1; transform: scale(1.12); }
        .play-btn {
            width: 40px; height: 40px; border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.65);
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.1); cursor: pointer;
            color: #fff; font-size: 15px; transition: all 0.2s;
        }
        .play-btn:hover { background: rgba(255,255,255,0.25); transform: scale(1.06); }

        /* ===== ENTRANCE ANIMATIONS ===== */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.92); }
            to   { opacity: 1; transform: scale(1); }
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-18px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes pulseGlow {
            0%,100% { box-shadow: 0 0 8px rgba(255,160,30,0.3); }
            50%      { box-shadow: 0 0 20px rgba(255,160,30,0.7); }
        }
        @keyframes subtitleIn {
            0%   { opacity:0; transform: scale(0.7) translateY(16px); filter: blur(6px); }
            60%  { opacity:1; transform: scale(1.04) translateY(-2px); filter: blur(0); }
            100% { opacity:1; transform: scale(1) translateY(0); filter: blur(0); }
        }
        @keyframes subtitleOut {
            0%   { opacity:1; transform: scale(1) translateY(0); filter: blur(0); }
            100% { opacity:0; transform: scale(0.85) translateY(8px); filter: blur(4px); }
        }
        @keyframes songChange {
            0%   { opacity:0; transform: translateY(-8px); }
            100% { opacity:1; transform: translateY(0); }
        }

        .card { animation: fadeInScale 0.6s cubic-bezier(0.34,1.56,0.64,1) both; }
        .banner { animation: fadeInDown 0.5s 0.1s ease both; }
        .avatar-wrap { animation: fadeInScale 0.5s 0.25s cubic-bezier(0.34,1.56,0.64,1) both; }
        .name-row { animation: slideInLeft 0.4s 0.35s ease both; }
        .bio-text { animation: slideInLeft 0.4s 0.4s ease both; }
        .social-row { animation: fadeInUp 0.4s 0.45s ease both; }
        .section { animation: fadeInUp 0.4s 0.55s ease both; }
        .music-section { animation: fadeInUp 0.4s 0.65s ease both; }

        .avatar { animation: pulseGlow 3s 1.5s ease-in-out infinite; }

        .song-name.changing { animation: songChange 0.35s ease both; }

        /* VOLUME SLIDER */
        .volume-row {
            display: flex; align-items: center; gap: 8px;
            margin-top: 10px; padding-top: 8px;
            border-top: 1px solid rgba(255,150,20,0.12);
        }
        .vol-icon { font-size: 13px; opacity: 0.6; min-width: 14px; text-align: center; }
        .vol-track {
            flex: 1; height: 14px; background: transparent;
            position: relative; display: flex; align-items: center; cursor: pointer;
        }
        .vol-track-inner {
            position: absolute; left:0; right:0; height: 3px;
            background: rgba(255,150,20,0.2); border-radius: 2px;
        }
        .vol-fill {
            height: 3px; background: linear-gradient(90deg,#f0a500,#ff6a00);
            border-radius: 2px; width: 80%; pointer-events: none; position: relative;
            box-shadow: 0 0 4px rgba(255,150,20,0.4);
        }
        .vol-thumb {
            position: absolute; right: -5px; top: 50%;
            transform: translateY(-50%);
            width: 11px; height: 11px; background: #ffb830;
            border-radius: 50%; pointer-events: none;
            box-shadow: 0 0 6px rgba(255,150,20,0.6);
            transition: transform 0.1s;
        }
        .vol-track:hover .vol-thumb { transform: translateY(-50%) scale(1.3); }
        .vol-pct { font-family: 'VT323',monospace; font-size: 13px; opacity: 0.55; min-width: 30px; text-align: right; }

        /* VIEWS BADGE */
        .views-badge {
            margin-top: 18px;
            font-size: 12px; opacity: 0.55;
            display: flex; align-items: center; gap: 5px;
            font-family: 'VT323',monospace; font-size: 15px;
            animation: fadeInScale 0.5s 0.3s both;
        }

        /* RIPPLE */
        .ripple-host { position: relative; overflow: hidden; }
        @keyframes ripple {
            to { transform: scale(4); opacity: 0; }
        }
        .ripple-wave {
            position: absolute; border-radius: 50%;
            background: rgba(255,180,30,0.35);
            width: 40px; height: 40px;
            margin-left: -20px; margin-top: -20px;
            animation: ripple 0.6s linear forwards;
            pointer-events: none;
        }

        /* PARTICLES */
        /* CURSOR TRAIL */
        .trail-dot {
            position: fixed;
            width: 6px; height: 6px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,200,60,0.95) 0%, rgba(255,140,0,0.5) 60%, transparent 100%);
            pointer-events: none;
            z-index: 99990;
            transform: translate(-50%,-50%);
            animation: trailFade 0.7s ease-out forwards;
        }
        @keyframes trailFade {
            0%   { opacity: 0.9; transform: translate(-50%,-50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%,-50%) scale(0.2) translateY(12px); }
        }

        /* CARD TILT 3D */
        #card-wrap {
            perspective: 1200px;
            display: flex; justify-content: center; align-items: center;
            width: 100%;
        }
        .card-frame {
            position: relative;
            width: 100%; max-width: 480px;
        }
        .card {
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out;
            will-change: transform;
        }

        /* RAIN OVERLAY */
        #rain {
            position: fixed; inset: 0;
            pointer-events: none; z-index: 1; overflow: hidden;
        }
        .raindrop {
            position: absolute;
            width: 1.5px;
            background: linear-gradient(to bottom, transparent, rgba(255,200,120,0.5), transparent);
            animation: fall linear infinite;
            pointer-events: none;
        }
        @keyframes fall {
            0%   { transform: translateY(-120px); opacity: 0; }
            10%  { opacity: 0.7; }
            90%  { opacity: 0.5; }
            100% { transform: translateY(100vh); opacity: 0; }
        }

        /* ===== INTRO OVERLAY ===== */
        #intro {
            position: fixed; inset: 0;
            z-index: 100000;
            display: flex; align-items: center; justify-content: center;
            background: rgba(12,6,0,0.35);
            backdrop-filter: blur(16px) saturate(1.2);
            -webkit-backdrop-filter: blur(16px) saturate(1.2);
            cursor: none;
            transition: opacity 0.7s ease, backdrop-filter 0.7s ease, background 0.7s ease;
        }
        #intro.hiding {
            opacity: 0;
            backdrop-filter: blur(0) saturate(1);
            -webkit-backdrop-filter: blur(0) saturate(1);
            background: rgba(12,6,0,0);
            pointer-events: none;
        }
        #intro-text {
            font-family: 'Quicksand', 'Inter', sans-serif;
            font-weight: 700;
            font-size: clamp(26px, 6vw, 46px);
            letter-spacing: 2px;
            color: #ffd88a;
            text-align: center;
            padding: 0 24px;
            text-shadow:
                0 0 8px rgba(255,190,70,0.9),
                0 0 22px rgba(255,160,30,0.75),
                0 0 48px rgba(255,130,0,0.5),
                0 4px 18px rgba(0,0,0,0.7);
            animation: introPulse 2.4s ease-in-out infinite, introIn 0.9s cubic-bezier(0.34,1.4,0.64,1) both;
            user-select: none;
        }
        #intro-sub {
            position: absolute;
            bottom: 12%;
            left: 0; right: 0;
            text-align: center;
            font-family: 'Quicksand', 'Inter', sans-serif;
            font-size: 13px;
            letter-spacing: 3px;
            color: rgba(255,200,120,0.55);
            text-shadow: 0 0 12px rgba(255,160,30,0.5);
            animation: introIn 0.9s 0.35s both;
        }
        @keyframes introPulse {
            0%,100% {
                text-shadow:
                    0 0 8px rgba(255,190,70,0.9),
                    0 0 22px rgba(255,160,30,0.75),
                    0 0 48px rgba(255,130,0,0.5),
                    0 4px 18px rgba(0,0,0,0.7);
                transform: scale(1);
            }
            50% {
                text-shadow:
                    0 0 14px rgba(255,210,110,1),
                    0 0 38px rgba(255,175,45,0.95),
                    0 0 78px rgba(255,140,0,0.7),
                    0 4px 18px rgba(0,0,0,0.7);
                transform: scale(1.035);
            }
        }
        @keyframes introIn {
            from { opacity: 0; transform: scale(0.8) translateY(14px); filter: blur(8px); }
            to   { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }

        /* Bio ẩn trước khi vào */
        body.locked #card-wrap,
        body.locked #subtitle-wrap { opacity: 0; pointer-events: none; }
        #card-wrap, #subtitle-wrap { transition: opacity 0.6s ease; }

        /* ===== BORDER CHẠY SÁNG ===== */
        #card-wrap { position: relative; }
        .card { position: relative; z-index: 1; }
        .card-frame::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 25px;
            padding: 3px;
            background: conic-gradient(
                from var(--beam-angle, 0deg),
                transparent 0deg,
                transparent 300deg,
                rgba(255,180,50,0.18) 320deg,
                rgba(255,200,90,0.85) 345deg,
                #ffe4a8 356deg,
                rgba(255,200,90,0.85) 366deg,
                rgba(255,180,50,0.18) 388deg,
                transparent 408deg,
                transparent 360deg
            );
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
            animation: beamSpin 4.5s linear infinite;
            pointer-events: none;
            filter: drop-shadow(0 0 6px rgba(255,180,60,0.55));
            z-index: 3;
        }
        /* Viền neon tĩnh, sáng liên tục quanh khung */
        .card-frame::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 23px;
            border: 1.5px solid rgba(255,170,40,0.35);
            box-shadow:
                0 0 6px rgba(255,170,40,0.5),
                0 0 16px rgba(255,140,20,0.35),
                inset 0 0 10px rgba(255,150,30,0.12);
            animation: neonBreathe 2.6s ease-in-out infinite;
            pointer-events: none;
            z-index: 2;
        }
        @keyframes neonBreathe {
            0%,100% { opacity: 0.55; }
            50%      { opacity: 1; }
        }
        @property --beam-angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }
        @keyframes beamSpin {
            to { --beam-angle: 360deg; }
        }
        /* fallback cho trình duyệt không hỗ trợ @property */
        @supports not (background: conic-gradient(from var(--a,0deg), red, blue)) {
            .card-frame::before { animation: beamSpinFallback 4.5s linear infinite; }
            @keyframes beamSpinFallback {
                to { transform: rotate(360deg); }
            }
        }

        /* SOUND RING - vòng sóng nhạc quanh khung */
        #sound-ring {
            position: absolute;
            inset: -20px;
            width: calc(100% + 40px);
            height: calc(100% + 40px);
            pointer-events: none;
            overflow: visible;
            z-index: 4;
        }
        .sound-bar {
            stroke: #ffc35a;
            stroke-width: 2.4;
            stroke-linecap: round;
            filter: drop-shadow(0 0 3px rgba(255,170,40,0.9));
            transition: opacity 0.3s ease;
        }
        #sound-ring.muted .sound-bar { opacity: 0.12; }

        #particles {
            position: fixed; inset: 0;
            pointer-events: none; z-index: 0; overflow: hidden;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,180,30,0.9) 0%, rgba(255,120,0,0.4) 60%, transparent 100%);
            animation: floatUp linear infinite;
            pointer-events: none;
        }
        @keyframes floatUp {
            0%   { transform: translateY(0) scale(1); opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 0.6; }
            100% { transform: translateY(-100vh) scale(0.3); opacity: 0; }
        }

        /* TOAST */
        #toast {
            position: fixed; top: 24px; left: 50%;
            transform: translateX(-50%) translateY(-80px);
            background: rgba(25,14,3,0.92);
            border: 1px solid rgba(255,160,30,0.4);
            backdrop-filter: blur(10px);
            border-radius: 12px; padding: 8px 20px;
            font-family: 'VT323',monospace; font-size: 18px;
            color: #ffb830; pointer-events: none;
            z-index: 9999;
            transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
            opacity: 0;
            white-space: nowrap;
        }
        #toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* CLOCK */
        #clock-badge {
            position: absolute; top: 14px; right: 0;
            font-family: 'VT323',monospace; font-size: 14px;
            opacity: 0.45; letter-spacing: 1px;
        }

        /* SUBTITLE (clean single definition) */
        #subtitle-wrap {
            position: fixed; bottom: 38px; left: 50%;
            transform: translateX(-50%);
            width: 100%; max-width: 580px;
            text-align: center; pointer-events: none;
            z-index: 999; padding: 0 20px;
        }
        #subtitle-text {
            display: inline-block;
            font-family: 'VT323', monospace; font-size: 24px; color: #fff;
            text-shadow: 0 0 16px rgba(255,160,30,0.95), 0 2px 10px rgba(0,0,0,0.95);

const GITHUB_RAW = 'https://raw.githubusercontent.com/tirumdz-d/TirumBio.github.io/main/status.json';

const STATUS_COLOR = { online:'#43b581', idle:'#faa61a', dnd:'#f04747', offline:'#747f8d' };
const STATUS_TEXT  = { online:'Online', idle:'Idle', dnd:'Bận', offline:'Offline' };

async function loadLanyard() {
    try {
        const r = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
        const d = (await r.json()).data;

        const dot = document.getElementById('dc-dot');
        const status = d.discord_status || 'offline';
        dot.style.background = STATUS_COLOR[status];

        const actEl   = document.getElementById('dc-activity');
        const actBox  = document.getElementById('dc-activity-box');
        const actImg  = document.getElementById('dc-act-img');
        const actName = document.getElementById('dc-act-name');
        const actDet  = document.getElementById('dc-act-detail');
        const actStat = document.getElementById('dc-act-state');

        const acts = (d.activities || []).filter(a => a.type !== 4);
        const spotify = d.spotify;

        if (spotify) {
            actBox.style.display = 'block';
            actImg.src = spotify.album_art_url;
            actImg.style.display = 'block';
            actName.textContent = '🎵 ' + spotify.song;
            actDet.textContent  = 'by ' + spotify.artist;
            actStat.textContent = 'on ' + spotify.album;
            actEl.textContent   = 'Nghe Spotify 🎵';
        } else if (acts.length > 0) {
            const a = acts[0];
            actBox.style.display = 'block';
            if (a.assets?.large_image) {
                actImg.src = `https://cdn.discordapp.com/app-assets/${a.application_id}/${a.assets.large_image}.png`;
                actImg.style.display = 'block';
            } else {
                actImg.style.display = 'none';
            }
            actName.textContent = a.name || '';
            actDet.textContent  = a.details || '';
            actStat.textContent = a.state || '';
            actEl.textContent   = 'Đang chơi ' + (a.name || '') + ' 🎮';
        } else {
            actBox.style.display = 'none';
            actEl.textContent = STATUS_TEXT[status];
        }

        const customAct = (d.activities || []).find(a => a.type === 4);
        if (customAct?.state) actEl.textContent = customAct.state;

    } catch(e) { console.log('Lanyard error', e); }
}

async function loadStatus() {
    try {
        const r = await fetch(GITHUB_RAW + '?t=' + Date.now());
        const d = await r.json();
        document.getElementById('status-emoji').textContent = d.emoji || '💤';
        document.getElementById('status-sub').innerHTML = (d.status || 'Đang ngủ') + '<br>' + (d.note || 'no reply = offline');
    } catch(e) { console.log('Status error', e); }
}

loadLanyard();
loadStatus();
setInterval(loadLanyard, 30000);
setInterval(loadStatus, 60000);

const subtitleEl = document.getElementById('subtitle-text');
let subtitleHideTimer = null;
let lastLineShownAt = 0;
let lastLineText = '';

function toggleLyric() {
    lyricOpen = !lyricOpen;
    if (!lyricOpen) {
        hideSubtitleNow();
        activeLyricIdx = -1;
    }
}

function showSubtitle(text) {
    clearTimeout(subtitleHideTimer);
    subtitleEl.classList.remove('show','hide');
    subtitleEl.textContent = text;
    requestAnimationFrame(() => requestAnimationFrame(() => {
        subtitleEl.classList.add('show');
    }));
}

function hideSubtitleNow() {
    clearTimeout(subtitleHideTimer);
    subtitleEl.classList.remove('show');
    subtitleEl.classList.add('hide');
    setTimeout(() => {
        subtitleEl.classList.remove('hide');
        subtitleEl.textContent = '';
    }, 350);
}

function updateLyric(currentTime) {
    if (!lyricOpen) { if (activeLyricIdx !== -1) { activeLyricIdx = -1; hideSubtitleNow(); } return; }
    const lines = LYRICS[currentSong] || [];
    if (!lines.length) return;

    let idx = -1;
    for (let i = 0; i < lines.length; i++) {
        if (currentTime >= lines[i][0]) idx = i;
    }

    if (idx !== activeLyricIdx) {
        activeLyricIdx = idx;
        if (idx < 0) {
            hideSubtitleNow();
        } else {
            lastLineShownAt = lines[idx][0];
            lastLineText = lines[idx][1];
            showSubtitle(lastLineText);
        }
        return;
    }

    if (idx >= 0) {
        const nextT = lines[idx + 1] ? lines[idx + 1][0] : null;
        const gap = nextT ? nextT - lines[idx][0] : 999;
        const elapsedSinceLine = currentTime - lines[idx][0];
        const showDuration = Math.min(Math.max(gap - 0.6, 1.8), 4.5);
        const isCurrentlyVisible = subtitleEl.classList.contains('show');
        if (gap > 2.5 && elapsedSinceLine > showDuration && isCurrentlyVisible) {
            hideSubtitleNow();
        }
    }
}

    SONGS.forEach((s, i) => {
        players[i] = new YT.Player('player' + i, {
            videoId: s.ytId,
            playerVars: { autoplay:0, controls:0, disablekb:1, fs:0, modestbranding:1, rel:0, playsinline:1 },
            events: {
                onStateChange: (e) => onStateChange(e, i),
                onReady: (e) => {
                    e.target.setVolume(currentVolume);
                    if (i === currentSong) {
                        activePlayer = players[i];
                        updateDisplay();
                        playerReady = true;
                        if (entered) activePlayer.playVideo();
                    }
                },
                onError: (e) => console.log('YT error', e.data),
            }
        });
    });
};

function onStateChange(event, idx) {
    if (idx !== currentSong) return;
    if (event.data === YT.PlayerState.PLAYING) {
        playing = true;
        document.getElementById('play-icon').className = 'fa-solid fa-pause';
        startTimer();
    } else if (event.data === YT.PlayerState.PAUSED) {
        playing = false;
        document.getElementById('play-icon').className = 'fa-solid fa-play';
        clearInterval(progressTimer);
    } else if (event.data === YT.PlayerState.ENDED) {
        playing = false; clearInterval(progressTimer); nextSong();
    }
}

function togglePlay() {
    if (!activePlayer || typeof activePlayer.getPlayerState !== 'function') return;
    playing ? activePlayer.pauseVideo() : activePlayer.playVideo();
}

function nextSong() {
    stopCurrent();
    currentSong = (currentSong + 1) % SONGS.length;
    activePlayer = players[currentSong];
    updateDisplay();
    setTimeout(() => { activePlayer && activePlayer.playVideo(); showToast && showToast(SONGS[currentSong].title); }, 350);
}

function prevSong() {
    stopCurrent();
    currentSong = (currentSong - 1 + SONGS.length) % SONGS.length;
    activePlayer = players[currentSong];
    updateDisplay();
    setTimeout(() => { activePlayer && activePlayer.playVideo(); showToast && showToast(SONGS[currentSong].title); }, 350);
}

function stopCurrent() {
    clearInterval(progressTimer); playing = false;
    document.getElementById('play-icon').className = 'fa-solid fa-play';
    if (activePlayer && typeof activePlayer.stopVideo === 'function') activePlayer.stopVideo();
    setWavePct(0);
    document.getElementById('time-current').textContent = '00:00';
}

function updateDisplay() {
    const nameEl = document.getElementById('song-display');
    nameEl.classList.remove('changing');
    void nameEl.offsetWidth;
    nameEl.classList.add('changing');
    nameEl.textContent = SONGS[currentSong].title;
    setWavePct(0);
    document.getElementById('time-current').textContent = '00:00';
    document.getElementById('time-total').textContent = '00:00';
    activeLyricIdx = -1;
    lastLineShownAt = 0;
    lastLineText = '';
    hideSubtitleNow();
    subtitleEl.textContent = '';
    applySongTint(currentSong);
}

function setVolume(pct) {
    currentVolume = Math.min(100, Math.max(0, pct));
    document.getElementById('vol-fill').style.width = currentVolume + '%';
    document.getElementById('vol-pct').textContent = Math.round(currentVolume) + '%';
    players.forEach(p => { if (p && typeof p.setVolume === 'function') p.setVolume(currentVolume); });
    const ring = document.getElementById('sound-ring');
    if (ring) ring.classList.toggle('muted', currentVolume <= 0);
}

const volTrack = document.getElementById('vol-track');
let volDragging = false;
function getVolPct(clientX) {
    const rect = volTrack.getBoundingClientRect();
    return Math.min(100, Math.max(0, (clientX - rect.left) / rect.width * 100));
}
volTrack.addEventListener('mousedown', e => { volDragging = true; setVolume(getVolPct(e.clientX)); e.preventDefault(); });
document.addEventListener('mousemove', e => { if (volDragging) setVolume(getVolPct(e.clientX)); });
document.addEventListener('mouseup', () => { volDragging = false; });
volTrack.addEventListener('touchstart', e => { volDragging = true; setVolume(getVolPct(e.touches[0].clientX)); }, { passive: false });
document.addEventListener('touchmove', e => { if (volDragging) setVolume(getVolPct(e.touches[0].clientX)); }, { passive: false });
document.addEventListener('touchend', () => { volDragging = false; });

function startTimer() {
    clearInterval(progressTimer);
    progressTimer = setInterval(() => {
        if (!activePlayer || typeof activePlayer.getDuration !== 'function') return;
        const dur = activePlayer.getDuration();
        const cur = activePlayer.getCurrentTime();
        if (!dur || dur <= 0) return;

        if (!isDragging) {
            setWavePct(Math.min((cur/dur)*100,100));
        }
        document.getElementById('time-current').textContent = fmtTime(cur);
        document.getElementById('time-total').textContent = fmtTime(dur);
        if (lyricOpen) updateLyric(cur);
    }, 300);
}

function fmtTime(s) {
    s = Math.floor(s||0);
    return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}

const track = document.getElementById('progress-track');
const thumb = document.getElementById('progress-thumb');

const WAVE_BAR_COUNT = 48;
let waveHeights = [];
function buildWaveform() {
    track.innerHTML = '';
    waveHeights = [];
    for (let i = 0; i < WAVE_BAR_COUNT; i++) {
        const h = 5 + Math.abs(Math.sin(i * 0.7 + currentSong)) * 12 + Math.random() * 4;
        waveHeights.push(h);
        const bar = document.createElement('div');
        bar.className = 'wave-bar';
        bar.style.height = h + 'px';
        track.appendChild(bar);
    }
    track.appendChild(thumb);
}
buildWaveform();

function setWavePct(pct) {
    const bars = track.querySelectorAll('.wave-bar');
    const activeCount = Math.round((pct / 100) * bars.length);
    bars.forEach((b, i) => b.classList.toggle('played', i < activeCount));
    const rect = track.getBoundingClientRect();
    thumb.style.left = (pct / 100 * rect.width) + 'px';
}

    'rgba(255,140,0,0.10)',
    'rgba(180,60,20,0.16)',
    'rgba(80,60,120,0.14)',
    'rgba(20,120,90,0.12)',

];
function applySongTint(idx) {
    const overlay = document.getElementById('tint-overlay');
    if (overlay) overlay.style.backgroundColor = SONG_TINTS[idx % SONG_TINTS.length];
}
let isDragging = false;

function getPct(clientX) {
    const rect = track.getBoundingClientRect();
    return Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
}
function seekToPct(pct) {
    if (!activePlayer || typeof activePlayer.getDuration !== 'function') return;
    const dur = activePlayer.getDuration();
    if (dur > 0) {
        setWavePct(pct * 100);
        activePlayer.seekTo(dur * pct, true);
    }
}

track.addEventListener('mousedown', e => {
    isDragging = true;
    track.classList.add('dragging');
    seekToPct(getPct(e.clientX));
    e.preventDefault();
});
document.addEventListener('mousemove', e => {
    if (!isDragging) return;
    setWavePct(getPct(e.clientX) * 100);
});
document.addEventListener('mouseup', e => {
    if (!isDragging) return;
    isDragging = false;
    track.classList.remove('dragging');
    seekToPct(getPct(e.clientX));
});

track.addEventListener('touchstart', e => {
    isDragging = true;
    track.classList.add('dragging');
    seekToPct(getPct(e.touches[0].clientX));
    e.preventDefault();
}, { passive: false });
document.addEventListener('touchmove', e => {
    if (!isDragging) return;
    setWavePct(getPct(e.touches[0].clientX) * 100);
}, { passive: false });
document.addEventListener('touchend', e => {
    if (!isDragging) return;
    isDragging = false;
    track.classList.remove('dragging');
    seekToPct(getPct(e.changedTouches[0].clientX));
});

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('copy', e => e.preventDefault());
document.addEventListener('cut', e => e.preventDefault());
document.addEventListener('keydown', e => {
    if ((e.ctrlKey && ['c','a','u','s'].includes(e.key.toLowerCase())) ||
        (e.ctrlKey && e.shiftKey && ['i','j','c'].includes(e.key.toLowerCase())) ||
        e.key === 'F12') e.preventDefault();
});

const dot = document.getElementById('cursor-dot');
const ring = document.getElementById('cursor-ring');
let mouseX=0, mouseY=0, ringX=0, ringY=0;
document.addEventListener('mousemove', e => {
    mouseX = e.clientX; mouseY = e.clientY;
    dot.style.left = mouseX+'px'; dot.style.top = mouseY+'px';
});
(function animateRing() {
    ringX += (mouseX-ringX)*0.18; ringY += (mouseY-ringY)*0.18;
    ring.style.left = ringX+'px'; ring.style.top = ringY+'px';
    requestAnimationFrame(animateRing);
})();
document.querySelectorAll('a,button,.play-btn,.ctrl-btn,.progress-track,.social-btn,.lyric-toggle').forEach(el => {
    el.addEventListener('mouseenter', () => document.body.classList.add('hovering'));
    el.addEventListener('mouseleave', () => document.body.classList.remove('hovering'));
});
document.addEventListener('mouseleave', () => { dot.style.opacity='0'; ring.style.opacity='0'; });
document.addEventListener('mouseenter', () => { dot.style.opacity='1'; ring.style.opacity='1'; });

(function typeText() {
    const el = document.getElementById('bio-text');
    const text = '- .... .. ... / .. ... / -- -.-- / ... .- ..-. . / ... .--. .- -.-. . / .-- . .-.. -.-. --- -- . / - --- / .. - ❤️';
    let i = 0;
    el.textContent = '';
    const t = setInterval(() => {
        el.textContent += text[i++];
        if (i >= text.length) clearInterval(t);
    }, 60);
})();

(async function loadViews() {
    try {
        const r = await fetch('https://api.countapi.xyz/hit/tirumdz-d.github.io/visits');
        const d = await r.json();
        document.getElementById('view-count').textContent = d.value.toLocaleString();
    } catch {
        const v = (parseInt(localStorage.getItem('v') || '0') + 1);
        localStorage.setItem('v', v);
        document.getElementById('view-count').textContent = v.toLocaleString();
    }
})();

function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    document.getElementById('clock-time').textContent = h + ':' + m;
}
updateClock();
setInterval(updateClock, 10000);

function showToast(msg) {
    const t = document.getElementById('toast');
    document.getElementById('toast-text').textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
}

function addRipple(el, e) {
    el.classList.add('ripple-host');
    const wave = document.createElement('div');
    wave.className = 'ripple-wave';
    const rect = el.getBoundingClientRect();
    wave.style.left = (e.clientX - rect.left) + 'px';
    wave.style.top  = (e.clientY - rect.top) + 'px';
    el.appendChild(wave);
    setTimeout(() => wave.remove(), 650);
}
document.querySelectorAll('.social-btn, .play-btn, .ctrl-btn, .discord-add-btn').forEach(el => {
    el.addEventListener('click', e => addRipple(el, e));
});

document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    if (e.code === 'ArrowRight' && !e.ctrlKey) nextSong();
    if (e.code === 'ArrowLeft'  && !e.ctrlKey) prevSong();
    if (e.code === 'ArrowUp')   { e.preventDefault(); setVolume(currentVolume + 5); }
    if (e.code === 'ArrowDown') { e.preventDefault(); setVolume(currentVolume - 5); }
    if (e.code === 'KeyL') toggleLyric();
});

(function spawnParticles() {
    const container = document.getElementById('particles');
    function spawn() {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = Math.random() * 5 + 2;
        const x = Math.random() * 100;
        const dur = Math.random() * 12 + 8;
        const delay = Math.random() * 6;
        p.style.cssText = `width:${size}px;height:${size}px;left:${x}%;bottom:-10px;animation-duration:${dur}s;animation-delay:${delay}s;opacity:0`;
        container.appendChild(p);
        setTimeout(() => p.remove(), (dur + delay) * 1000);
    }
    for (let i = 0; i < 18; i++) setTimeout(spawn, i * 400);
    setInterval(spawn, 1200);
})();

(function cursorTrail() {
    let lastX = 0, lastY = 0, lastTime = 0;
    document.addEventListener('mousemove', e => {
        const now = Date.now();
        if (now - lastTime < 28) return;
        const dx = e.clientX - lastX, dy = e.clientY - lastY;
        if (Math.sqrt(dx*dx + dy*dy) < 8) return;
        lastX = e.clientX; lastY = e.clientY; lastTime = now;

        const d = document.createElement('div');
        d.className = 'trail-dot';
        const size = Math.random() * 4 + 4;
        d.style.width = size + 'px';
        d.style.height = size + 'px';
        d.style.left = e.clientX + (Math.random()*6 - 3) + 'px';
        d.style.top  = e.clientY + (Math.random()*6 - 3) + 'px';
        document.body.appendChild(d);
        setTimeout(() => d.remove(), 720);
    });
})();

(function cardTilt() {
    const wrap = document.getElementById('card-wrap');
    const card = document.querySelector('.card');
    if (!wrap || !card) return;
    let raf = null;

    wrap.addEventListener('mousemove', e => {
        if (raf) cancelAnimationFrame(raf);
        raf = requestAnimationFrame(() => {
            const r = card.getBoundingClientRect();
            const px = (e.clientX - r.left) / r.width  - 0.5;
            const py = (e.clientY - r.top)  / r.height - 0.5;
            const rotY = px * 9;
            const rotX = -py * 9;
            card.style.transform =
                `rotateX(${rotX}deg) rotateY(${rotY}deg) translateZ(6px)`;

            const shadowX = -px * 34;
            const shadowY = 18 - py * 24;
            card.style.boxShadow =
                `${shadowX}px ${shadowY}px 42px rgba(150,60,0,0.35), 0 0 0 1px rgba(255,160,30,0.08)`;
        });
    });

    wrap.addEventListener('mouseleave', () => {
        if (raf) cancelAnimationFrame(raf);
        card.style.transition = 'transform 0.5s cubic-bezier(0.34,1.4,0.64,1), box-shadow 0.5s ease';
        card.style.transform = 'rotateX(0) rotateY(0) translateZ(0)';
        card.style.boxShadow = '0 12px 40px rgba(180,80,0,0.25)';
        setTimeout(() => card.style.transition = 'transform 0.15s ease-out', 500);
    });
})();

(function makeRain() {
    const rain = document.getElementById('rain');
    if (!rain) return;
    function drop() {
        const d = document.createElement('div');
        d.className = 'raindrop';
        const h = Math.random() * 40 + 30;
        const dur = Math.random() * 1.2 + 0.9;
        d.style.height = h + 'px';
        d.style.left = Math.random() * 100 + '%';
        d.style.top = '-120px';
        d.style.animationDuration = dur + 's';
        d.style.animationDelay = (Math.random() * 0.5) + 's';
        rain.appendChild(d);
        setTimeout(() => d.remove(), (dur + 0.6) * 1000);
    }
    for (let i = 0; i < 24; i++) setTimeout(drop, i * 90);
    setInterval(drop, 140);
})();

(function soundRing() {
    const svg = document.getElementById('sound-ring');
    const frame = document.querySelector('.card-frame');
    if (!svg || !frame) return;

    const BAR_COUNT = 64;
    const PAD = 20;
    const MIN_LEN = 3;
    const MAX_LEN = 18;
    let bars = [];
    const ns = 'http://www.w3.org/2000/svg';

    function roundRectPath(w, h, r) {
        r = Math.min(r, w / 2, h / 2);
        return `M ${r},0
                H ${w-r}
                A ${r},${r} 0 0 1 ${w},${r}
                V ${h-r}
                A ${r},${r} 0 0 1 ${w-r},${h}
                H ${r}
                A ${r},${r} 0 0 1 0,${h-r}
                V ${r}
                A ${r},${r} 0 0 1 ${r},0 Z`;
    }

    function build() {
        const rect = frame.getBoundingClientRect();
        const w = rect.width;
        const h = rect.height;

        svg.setAttribute('viewBox', `0 0 ${w + PAD * 2} ${h + PAD * 2}`);
        svg.innerHTML = '';
        bars = [];

        const d = roundRectPath(w, h, 25);
        const tmpPath = document.createElementNS(ns, 'path');
        tmpPath.setAttribute('d', d);
        svg.appendChild(tmpPath);

        const totalLen = tmpPath.getTotalLength();

        function pointAt(dist) {
            const pt = tmpPath.getPointAtLength(dist);
            return { x: pt.x, y: pt.y };
        }

        for (let i = 0; i < BAR_COUNT; i++) {
            const dist = (i / BAR_COUNT) * totalLen;
            const p1 = pointAt(dist);
            const p2 = pointAt((dist + 1) % totalLen);

            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const mag = Math.hypot(dx, dy) || 1;

            const nx = dy / mag;
            const ny = -dx / mag;

            const line = document.createElementNS(ns, 'line');
            line.setAttribute('class', 'sound-bar');

            const bx = p1.x + PAD;
            const by = p1.y + PAD;

            line.setAttribute('x1', bx);
            line.setAttribute('y1', by);
            line.setAttribute('x2', bx + nx * MIN_LEN);
            line.setAttribute('y2', by + ny * MIN_LEN);

            svg.appendChild(line);

            bars.push({
                el: line,
                bx,
                by,
                nx,
                ny,
                current: MIN_LEN,
                target: MIN_LEN,
                phase: Math.random() * Math.PI * 2,
                seed: Math.random()
            });
        }

        svg.removeChild(tmpPath);
    }

    let retargetTimer = null;

    function retarget() {
        const active = playing && currentVolume > 0;

        if (!active) {
            bars.forEach(b => {
                b.target = MIN_LEN;
            });
            return;
        }

        /*
         * YouTube không cho trang lấy trực tiếp biên độ âm thanh của
         * iframe, nên visualizer dùng nhịp biến thiên mượt theo thời gian
         * phát + một chút ngẫu nhiên. Vì vậy thanh lúc dài lúc ngắn,
         * thay vì tất cả cùng dài như nhau.
         */
        let songTime = 0;
        try {
            if (activePlayer && typeof activePlayer.getCurrentTime === 'function') {
                songTime = activePlayer.getCurrentTime() || 0;
            }
        } catch (e) {}

        const volumeScale = currentVolume / 100;

        bars.forEach((b, i) => {
            const wave1 = (Math.sin(songTime * 7.0 + i * 0.72 + b.phase) + 1) / 2;
            const wave2 = (Math.sin(songTime * 11.0 - i * 0.31 + b.phase * 1.7) + 1) / 2;
            const beat = Math.pow((wave1 * 0.68 + wave2 * 0.32), 1.35);

            const randomPulse = 0.72 + Math.random() * 0.5;
            const desired = MIN_LEN +
                beat * (MAX_LEN - MIN_LEN) *
                volumeScale *
                randomPulse;

            b.target = Math.min(MAX_LEN, Math.max(MIN_LEN, desired));
        });
    }

    function tick() {
        bars.forEach(b => {
            b.current += (b.target - b.current) * 0.22;

            b.el.setAttribute('x2', b.bx + b.nx * b.current);
            b.el.setAttribute('y2', b.by + b.ny * b.current);
        });

        requestAnimationFrame(tick);
    }

    let resizeTO = null;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTO);
        resizeTO = setTimeout(build, 200);
    });

    setTimeout(build, 900);
    retargetTimer = setInterval(retarget, 90);
    requestAnimationFrame(tick);
})();

document.body.classList.add('locked');

function enterBio() {
    if (entered) return;
    entered = true;

    const intro = document.getElementById('intro');
    intro.classList.add('hiding');
    document.body.classList.remove('locked');
    setTimeout(() => intro.remove(), 750);

    if (playerReady && activePlayer) {
        activePlayer.playVideo();
    }
}

document.getElementById('intro').addEventListener('click', enterBio);
document.getElementById('intro').addEventListener('touchstart', e => {
    e.preventDefault(); enterBio();
}, { passive: false });
document.addEventListener('keydown', e => {
    if (!entered && (e.code === 'Space' || e.code === 'Enter')) {
        e.preventDefault(); enterBio();
    }
}, true);
</script>
