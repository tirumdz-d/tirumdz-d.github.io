const SONGS = [
    { title: 'Nơi Này Có Anh', ytId: 'v9GlvPzvprg' },
    { title: 'Không Buông',    ytId: '59YbarIOuY0' },
    { title: 'Điểm Đến Cuối Cùng', ytId: 'b-kllJ9c3l4' },
];

let currentSong = 0;
let players = [];
let activePlayer = null;
let playing = false;
let progressTimer = null;
let lyricOpen = false;
let activeLyricIdx = -1;

function toggleLyric() {
    lyricOpen = !lyricOpen;
    document.getElementById('lyric-box').classList.toggle('open', lyricOpen);
    if (lyricOpen) renderLyrics();
}

function renderLyrics() {
    const inner = document.getElementById('lyric-inner');
    const lines = LYRICS[currentSong] || [];
    inner.innerHTML = lines.map((l, i) =>
        `<div class="lyric-line" id="ll${i}">${l[1]}</div>`
    ).join('');
    activeLyricIdx = -1;
}

function updateLyric(currentTime) {
    const lines = LYRICS[currentSong] || [];
    if (!lines.length) return;
    let idx = 0;
    for (let i = 0; i < lines.length; i++) {
        if (currentTime >= lines[i][0]) idx = i;
        else break;
    }
    if (idx === activeLyricIdx) return;
    activeLyricIdx = idx;
    const inner = document.getElementById('lyric-inner');
    inner.querySelectorAll('.lyric-line').forEach((el, i) => {
        el.classList.toggle('active', i === idx);
    });
    const activeEl = document.getElementById('ll' + idx);
    if (activeEl) {
        activeEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
}

// ===== YOUTUBE =====
const tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(tag);

window.onYouTubeIframeAPIReady = function () {
    SONGS.forEach((s, i) => {
        players[i] = new YT.Player('player' + i, {
            videoId: s.ytId,
            playerVars: { autoplay:0, controls:0, disablekb:1, fs:0, modestbranding:1, rel:0, playsinline:1 },
            events: {
                onStateChange: (e) => onStateChange(e, i),
                onError: (e) => console.log('YT error', e.data),
            }
        });
    });
    activePlayer = players[0];
    updateDisplay();
};

function onStateChange(event, idx) {
    if (idx !== currentSong) return;
    if (event.data === YT.PlayerState.PLAYING) {
        playing = true;
        document.getElementById('play-icon').className = 'fa-solid fa-pause';
        startTimer();
    } else if (event.data === YT.PlayerState.PAUSED) {
        playing = false;
        document.getElementById('play-icon').className = 'fa-solid fa-play';
        clearInterval(progressTimer);
    } else if (event.data === YT.PlayerState.ENDED) {
        playing = false; clearInterval(progressTimer); nextSong();
    }
}

function togglePlay() {
    if (!activePlayer || typeof activePlayer.getPlayerState !== 'function') return;
    playing ? activePlayer.pauseVideo() : activePlayer.playVideo();
}

function nextSong() {
    stopCurrent();
    currentSong = (currentSong + 1) % SONGS.length;
    activePlayer = players[currentSong];
    updateDisplay();
    setTimeout(() => activePlayer && activePlayer.playVideo(), 300);
}

function prevSong() {
    stopCurrent();
    currentSong = (currentSong - 1 + SONGS.length) % SONGS.length;
    activePlayer = players[currentSong];
    updateDisplay();
    setTimeout(() => activePlayer && activePlayer.playVideo(), 300);
}

function stopCurrent() {
    clearInterval(progressTimer); playing = false;
    document.getElementById('play-icon').className = 'fa-solid fa-play';
    if (activePlayer && typeof activePlayer.stopVideo === 'function') activePlayer.stopVideo();
    document.getElementById('progress-fill').style.width = '0%';
    document.getElementById('time-current').textContent = '00:00';
}

function updateDisplay() {
    document.getElementById('song-display').textContent = SONGS[currentSong].title;
    document.getElementById('progress-fill').style.width = '0%';
    document.getElementById('time-current').textContent = '00:00';
    document.getElementById('time-total').textContent = '00:00';
    if (lyricOpen) renderLyrics();
}

function startTimer() {
    clearInterval(progressTimer);
    progressTimer = setInterval(() => {
        if (!activePlayer || typeof activePlayer.getDuration !== 'function') return;
        const dur = activePlayer.getDuration();
        const cur = activePlayer.getCurrentTime();
        if (!dur || dur <= 0) return;
        document.getElementById('progress-fill').style.width = Math.min((cur/dur)*100,100) + '%';
        document.getElementById('time-current').textContent = fmtTime(cur);
        document.getElementById('time-total').textContent = fmtTime(dur);
        if (lyricOpen) updateLyric(cur);
    }, 300);
}

function fmtTime(s) {
    s = Math.floor(s||0);
    return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}

document.getElementById('progress-track').addEventListener('click', function(e) {
    if (!activePlayer || typeof activePlayer.getDuration !== 'function') return;
    const rect = this.getBoundingClientRect();
    const dur = activePlayer.getDuration();
    if (dur > 0) activePlayer.seekTo(dur * (e.clientX - rect.left) / rect.width, true);
});

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('copy', e => e.preventDefault());
document.addEventListener('cut', e => e.preventDefault());
document.addEventListener('keydown', e => {
    if ((e.ctrlKey && ['c','a','u','s'].includes(e.key.toLowerCase())) ||
        (e.ctrlKey && e.shiftKey && ['i','j','c'].includes(e.key.toLowerCase())) ||
        e.key === 'F12') e.preventDefault();
});

// ===== CUSTOM CURSOR =====
const dot = document.getElementById('cursor-dot');
const ring = document.getElementById('cursor-ring');
let mouseX=0, mouseY=0, ringX=0, ringY=0;
document.addEventListener('mousemove', e => {
    mouseX = e.clientX; mouseY = e.clientY;
    dot.style.left = mouseX+'px'; dot.style.top = mouseY+'px';
});
(function animateRing() {
    ringX += (mouseX-ringX)*0.18; ringY += (mouseY-ringY)*0.18;
    ring.style.left = ringX+'px'; ring.style.top = ringY+'px';
    requestAnimationFrame(animateRing);
})();
document.querySelectorAll('a,button,.play-btn,.ctrl-btn,.progress-track,.social-btn,.lyric-toggle').forEach(el => {
    el.addEventListener('mouseenter', () => document.body.classList.add('hovering'));
    el.addEventListener('mouseleave', () => document.body.classList.remove('hovering'));
});
document.addEventListener('mouseleave', () => { dot.style.opacity='0'; ring.style.opacity='0'; });
document.addEventListener('mouseenter', () => { dot.style.opacity='1'; ring.style.opacity='1'; });
</script>
